name: ねこの島クラウド番

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neko-island-keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: keeper
      - run: node index.mjs
        working-directory: keeper
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          CONTACT: ${{ vars.CONTACT }}
          SCRATCH_USER: ${{ secrets.SCRATCH_USER }}
          SCRATCH_PASS: ${{ secrets.SCRATCH_PASS }}
          SCRATCH_SESSION: ${{ secrets.SCRATCH_SESSION }}
          STAY_MINUTES: "28"
      - name: バックアップを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keeper/backup.json
          git diff --cached --quiet || (git commit -m "島のバックアップ" && git pull --rebase && git push)
