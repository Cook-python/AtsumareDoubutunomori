<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>絶対にバズるSNS Y</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --ground:#08101d;
  --card:#14243d;
  --card2:#1b3051;
  --line:#26405f;
  --ink:#eaf0f8;
  --mute:#8c9cb6;
  --blue:#2f6fe0;
  --flame:#ff4d2e;
  --heat:#ffb21f;
  --good:#3fb57a;
  --lime:#8bc34a;
  --lime-bg:#eef2ea;
  --lime-ink:#20261c;
  --lime-mute:#7d8577;
  --telop:#fff24a;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 24px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--heat);outline-offset:2px}

.app{max-width:480px;margin-inline:auto;display:grid;gap:14px;padding-bottom:72px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--ground);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.mark{font-family:var(--display);font-size:30px;line-height:1;color:var(--card);-webkit-text-stroke:1.6px var(--ink);paint-order:stroke}
.meter{flex:1;min-width:0;display:grid;gap:3px}
.meter-head{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.meter-head em{font-style:normal;color:var(--heat);font-weight:700}
.track{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--heat),var(--flame));transition:width .6s ease}
.mini{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.mini[aria-pressed="true"]{border-color:var(--heat);color:var(--heat)}

.screen{display:grid;gap:14px;align-content:start}
[hidden]{display:none!important}

.join{background:var(--card);border-radius:16px;padding:40px 24px;display:grid;gap:18px;justify-items:center;text-align:center;margin-top:24px}
.join .big{font-family:var(--display);font-size:120px;line-height:.9;color:var(--card);-webkit-text-stroke:5px var(--ink);paint-order:stroke}
.join h1{margin:0;font-size:28px;font-weight:900;line-height:1.3;text-wrap:balance}
.join p{margin:0;color:var(--mute)}
.cta{background:var(--blue);border:0;border-radius:999px;padding:10px 40px;font-weight:900;color:#fff;font-size:16px}
.cta:disabled{opacity:.45;cursor:default}
.fine{font-size:12px;color:var(--mute);text-align:center;margin:0}

.form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.form h2{margin:0;font-size:18px}
.row{display:grid;gap:4px;min-width:0}
.row label{font-size:12px;color:var(--mute);font-weight:700}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form input,.form select,.form textarea{width:100%;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.form textarea{min-height:90px;resize:vertical;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mute)}
.chips button:hover{color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:12px;min-height:150px;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:13px;cursor:pointer;overflow:hidden;position:relative}
.drop.over{border-color:var(--blue)}
.drop img{width:100%;max-height:300px;object-fit:cover;display:block}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.foot{display:flex;align-items:center;gap:10px}
.foot .fine{margin-right:auto;text-align:left}

.status{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px;padding-inline:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--heat);animation:blink 1s infinite;flex:none}
.status.done .dot{background:var(--good);animation:none}
.status.off .dot{background:var(--mute);animation:none}
@keyframes blink{50%{opacity:.25}}

.tw{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;color:#fff;flex:none}
.tw-head{display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline;font-size:12px;min-width:0}
.tw-head b{font-size:14px}
.tw-head span{color:var(--mute)}
.tw-text{grid-column:2;white-space:pre-wrap;overflow-wrap:anywhere}
.tw.main .tw-text{font-size:16px}
.tw-img{grid-column:2;margin-top:6px;border-radius:12px;max-height:340px;width:100%;object-fit:cover;border:1px solid var(--line)}
.acts{grid-column:2;display:flex;justify-content:space-between;max-width:360px;margin-top:6px;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.acts span{display:inline-flex;align-items:center;gap:4px}
.acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.tw.main .acts span{transition:color .3s}
.tw.main.burn .acts span{color:var(--flame)}
.tw.good{border-color:#2c5a46}
.tw.quote{border-color:var(--flame)}
.tag{display:inline-block;font-size:10px;font-weight:900;color:var(--flame);border:1px solid var(--flame);border-radius:4px;padding:0 5px;margin-right:4px}
.list{display:grid;gap:8px}
.list>*{animation:slide .35s ease}
@keyframes slide{from{transform:translateY(-8px);opacity:0}}
.sec{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;padding-inline:4px}

.trend{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.trend h3{margin:0;font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.trend h3 span{color:var(--mute);font-weight:500}
.trend ol{list-style:none;margin:0;padding:4px 0}
.trend li{padding:8px 14px;display:grid;gap:1px;animation:slide .35s ease}
.trend li small{color:var(--mute);font-size:11px}
.trend li b{font-size:15px;overflow-wrap:anywhere}
.trend li i{font-style:normal;color:var(--flame);font-size:11px;font-weight:700}
.empty{padding:16px 14px;color:var(--mute);font-size:13px}

.lime{background:var(--lime-bg);color:var(--lime-ink);border-radius:16px;overflow:hidden;min-height:420px;display:grid;grid-template-rows:auto 1fr}
.lime-head{background:var(--lime);color:#fff;padding:10px 14px;font-weight:900;display:flex;align-items:center;gap:10px}
.lime-head button{background:none;border:0;color:#fff;font-size:20px;line-height:1;padding:0 4px}
.lime-head span{letter-spacing:.04em}
.rooms{display:grid;align-content:start}
.room{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid #dde3d8;background:transparent;text-align:left;color:inherit}
.room .av{width:44px;height:44px;grid-row:span 2}
.room b{font-size:14px}
.room p{margin:0;font-size:12px;color:var(--lime-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:2}
.room em{grid-row:1/3;grid-column:3;font-style:normal;background:var(--flame);color:#fff;border-radius:999px;font-size:11px;font-weight:900;min-width:20px;text-align:center;padding:1px 6px}
.room em:empty{display:none}
.talk{display:grid;align-content:start;gap:10px;padding:14px}
.msg{display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 8px;animation:slide .35s ease}
.msg .av{width:34px;height:34px;font-size:13px;grid-row:span 2}
.msg small{font-size:11px;color:var(--lime-mute)}
.msg p{grid-column:2;margin:0;justify-self:start;background:#fff;border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.08);overflow-wrap:anywhere}
.msg a{grid-column:2;justify-self:start;display:grid;gap:2px;background:#fff;border-radius:12px;padding:8px 12px;font-size:12px;color:var(--lime-ink);text-decoration:none;border:1px solid #d6dccf;cursor:pointer}
.msg a b{font-size:13px}

.reel{position:relative;aspect-ratio:9/16;max-width:100%;max-height:78vh;margin-inline:auto;width:100%;overflow:hidden;background:#fff;border-radius:16px}
.reel-bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(14px) grayscale(.5) brightness(1.35)}
.reel-bg.text{display:grid;place-items:center;font-size:56px;font-weight:900;color:#ccc;filter:blur(8px);text-align:center;padding:20px;line-height:1.1}
.telop{position:absolute;left:0;right:0;top:10%;display:grid;gap:4px;justify-items:center;text-align:center;font-family:var(--display);font-size:clamp(22px,7vw,32px);line-height:1.2;padding:12px}
.telop span{color:var(--telop);-webkit-text-stroke:6px #111;paint-order:stroke;animation:pop .4s ease both}
.telop span.red{color:#ff2a2a;-webkit-text-stroke:6px #fff;font-size:1.3em}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.sub{position:absolute;left:12px;right:12px;bottom:84px;text-align:center;font-weight:900;font-size:17px;color:#fff;-webkit-text-stroke:4px #000;paint-order:stroke;min-height:3em;display:grid;place-items:end center}
.reel-foot{position:absolute;left:0;right:0;bottom:0;padding:12px;color:#fff;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:grid;gap:2px}
.reel-foot b{font-size:13px}
.prog{position:absolute;left:0;top:0;height:3px;background:var(--flame);width:0;transition:width .4s}

.report{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;display:grid;gap:16px;text-align:center}
.report h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;color:var(--flame)}
.nick{font-family:var(--display);font-size:clamp(26px,8vw,36px);line-height:1.2;overflow-wrap:anywhere}
.nick small{display:block;font-family:var(--body);font-size:12px;color:var(--mute);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats div{background:var(--ground);border-radius:10px;padding:10px;display:grid}
.stats b{font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--mute)}
.lesson{margin:0;font-weight:700;text-wrap:balance}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:700}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:120px;background:none;border:0;padding:10px 4px;font-size:12px;font-weight:700;color:var(--mute);position:relative}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.tabs em{position:absolute;top:4px;margin-left:2px;font-style:normal;background:var(--flame);color:#fff;border-radius:999px;font-size:10px;padding:0 5px}
.tabs em:empty{display:none}

.banner{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;width:min(440px,calc(100% - 32px));display:grid;gap:6px;pointer-events:none}
.note{pointer-events:auto;background:rgba(27,48,81,.97);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 10px;align-items:center;animation:drop .3s ease;cursor:pointer;text-align:left;color:var(--ink)}
.note i{grid-row:span 2;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:15px;background:var(--card);border:1px solid var(--ink)}
.note.l i{background:var(--lime);border-color:var(--lime);color:#fff;font-size:10px}
.note small{color:var(--mute);font-size:11px}
.note span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <span class="mark">Y</span>
    <div class="meter">
      <div class="meter-head"><span>炎上度</span><em id="stage">平和</em></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <button class="mini" id="sound" aria-pressed="true">通知音</button>
    <button class="mini" id="fast" aria-pressed="false">早送り</button>
  </header>

  <section class="screen" id="s-join">
    <div class="join">
      <div class="big">Y</div>
      <h1>絶対にバズるSNS、<br>誕生。</h1>
      <p>今すぐ参加しましょう。</p>
      <button class="cta" id="join">参加する</button>
    </div>
    <p class="fine">ここは架空のSNSです。あなたの投稿を見るのは、あなただけです。</p>
  </section>

  <section class="screen" id="s-prof" hidden>
    <form class="form" id="profForm">
      <h2>プロフィールを作成</h2>
      <div class="pair">
        <div class="row"><label for="name">名前</label><input id="name" maxlength="16" required placeholder="表示名"></div>
        <div class="row"><label for="uid">ユーザーID</label><input id="uid" maxlength="16" placeholder="英数字"></div>
      </div>
      <div class="pair">
        <div class="row"><label for="gender">性別</label>
          <select id="gender"><option value="">答えない</option><option>男性</option><option>女性</option><option>その他</option></select>
        </div>
        <div class="row"><label for="age">年齢</label><input id="age" type="number" min="6" max="120" inputmode="numeric" placeholder="例 28"></div>
      </div>
      <div class="row"><label for="job">職業</label><input id="job" maxlength="20" placeholder="例 会社員"></div>
      <div class="chips" id="jobChips"></div>
      <button class="cta" type="submit">次へ</button>
    </form>
  </section>

  <section class="screen" id="s-post" hidden>
    <form class="form" id="postForm">
      <h2>バズらせたい写真を投稿</h2>
      <label class="drop" id="drop"><span id="dropText">タップして写真を選ぶ<br>（ドラッグでもOK）</span><input type="file" id="file" accept="image/*"></label>
      <div class="row"><label for="text">ひとこと</label><textarea id="text" maxlength="140" placeholder="いまどうしてる？"></textarea></div>
      <div class="foot"><p class="fine" id="count">0 / 140</p><button class="cta" id="send" type="submit" disabled>投稿する</button></div>
    </form>
    <p class="fine" id="aiNote">粗探しAIが、写真の細かいところまで粗を探します。</p>
  </section>

  <section class="screen" id="s-home" hidden>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">投稿しました</span></div>
    <div id="mainPost"></div>
    <div class="sec"><span>リプライ</span><span>新しい順</span></div>
    <div class="list" id="replies"></div>
  </section>

  <section class="screen" id="s-trend" hidden>
    <div class="trend">
      <h3>いまどうしてる？<span>日本のトレンド</span></h3>
      <ol id="trends"></ol>
      <div class="empty" id="trendEmpty">いまは平和です。</div>
    </div>
  </section>

  <section class="screen" id="s-lime" hidden>
    <div class="lime">
      <div class="lime-head"><button id="back" hidden aria-label="トーク一覧に戻る">‹</button><span id="limeTitle">LIME</span></div>
      <div class="rooms" id="rooms"></div>
      <div class="talk" id="talk" hidden></div>
    </div>
  </section>

  <section class="screen" id="s-video" hidden>
    <div id="reel"><div class="empty">まだ動画はありません。</div></div>
  </section>

  <section class="screen" id="s-end" hidden>
    <div class="report" id="report"></div>
  </section>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="home" aria-selected="true">ホーム<em></em></button>
  <button data-tab="trend">トレンド<em></em></button>
  <button data-tab="lime">LIME<em></em></button>
  <button data-tab="video">動画<em></em></button>
</nav>
<div class="banner" id="banner"></div>

<script>

  pet: ["かわいすぎる…", "癒やされました", "名前なんていうんですか？", "毎日見たい"],

  any: ["いいですね！", "素敵", "わかる〜", "こういうのでいいんだよ", "朝から元気出た", "保存しました"]
}

const NITPICK = {
  food: [
    "こんな{t}ばかり食べてたら、絶対栄養失調になるぞ",
    "{t}の盛り付けが雑すぎる。料理なめてる？",
    "それ{t}じゃなくて、ただの失敗作では",

function ping(kind) {
  if (muted) return
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)()
    const t = audio.currentTime
    const notes = kind === "lime" ? [880, 1320] : kind === "bad" ? [520, 390] : [1046]
    notes.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain()
      const at = t + i * .09
      o.frequency.value = f
      g.gain.setValueAtTime(.0001, at)
      g.gain.exponentialRampToValueAtTime(.12, at + .01)
      g.gain.exponentialRampToValueAtTime(.0001, at + .16)
      o.connect(g).connect(audio.destination)
      o.start(at)
      o.stop(at + .2)
    })
  } catch {}
}

function analyze(src) {
  return new Promise(res => {
    const img = new Image()
    img.onload = () => {
      const c = document.createElement("canvas")
      c.width = c.height = 48
      const g = c.getContext("2d")
      g.drawImage(img, 0, 0, 48, 48)
      const d = g.getImageData(0, 0, 48, 48).data
      let r = 0, gg = 0, b = 0, white = 0, sat = 0
      for (let i = 0; i < d.length; i += 4) {
        r += d[i]; gg += d[i + 1]; b += d[i + 2]
        const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2])
        if (mn > 232) white++
        sat += mx ? (mx - mn) / mx : 0
      }
      const n = d.length / 4
      r /= n; gg /= n; b /= n
      const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b)
      let hue = 0
      if (mx !== mn) {
        hue = mx === r ? (gg - b) / (mx - mn) : mx === gg ? 2 + (b - r) / (mx - mn) : 4 + (r - gg) / (mx - mn)
        hue = (hue * 60 + 360) % 360
      }
      res({ light: (r + gg + b) / 765, white: white / n, sat: sat / n, hue, ratio: img.width / img.height, px: Math.max(img.width, img.height) })
    }
    img.onerror = () => res(null)
    img.src = src
  })
}

}

  const textHits = TEXT_RULES.filter(([re]) => re.test(ctx.text)).map(x => x[1])
  if (!ctx.text) textHits.push("無言で写真だけ上げるの怖い")
  if (ctx.text.length > 90) textHits.push("長文で言い訳してる時点でアウト")
  const h = new Date().getHours()
  if (h < 5 || h >= 23) textHits.push("こんな時間に投稿してる時点で生活が乱れてる")
  const imgHits = ctx.pic ? IMG_RULES.filter(([f]) => f(ctx.pic)).flatMap(x => x[1]) : []
  const profHits = PROFILE_RULES.filter(([f]) => f(ctx)).flatMap(x => x[1])
  const replies = [
    ...take(imgHits, 2),
    ...take(textHits, 2),
    ...take(NITPICK[cat] || [], 3),
    ...(ctx.photo ? take(IMG_ALWAYS, 2) : []),
    ...take(profHits, 2),
    ...take(CONSPIRACY, 1),
    ...take(NITPICK.any, 6)
  ].map(s => fill(s, ctx))
  const lead = replies.splice(0, 3)
  const work = (WORK.find(([re]) => re.test(ctx.job || "会社員")))[1]
  const friend = pick(FRIEND)
  const whys = TELOP_WHY.filter(s => (ctx.age && ctx.job) || !s.includes("{job}"))
  return {
    nick: ctx.nick,
    positive: take([...(POSITIVE[cat] || []), ...POSITIVE.any], 5),
    replies: [...lead, ...shuffle(replies)],
    trends: shuffle([`#${ctx.nick}`, `#${ctx.t}炎上`, `${ctx.job || "一般人"} 炎上`, `#${ctx.t}警察`, "やらせ疑惑", `${ctx.t}の人`, "#拡散希望", `${CAT_NAME[cat]}投稿`]).slice(0, 6),
    mom: [pick(MOM.open), ...take(MOM.mid, 2), pick(MOM.close)].map(s => fill(s, ctx)),
    work: work.map(([from, color, lines]) => ({ from, color, lines: lines.map(s => fill(s, ctx)) })),
    friend: { from: friend[0], color: friend[1], lines: [pick(FRIEND_OPEN), pick(FRIEND_LINK)].map(s => fill(s, ctx)) },
    telop: [fill(TELOP_HEAD[cat], ctx), pick(TELOP_BOOM), fill(pick(whys), ctx), pick(TELOP_END)],
    headline: `${fill(TELOP_HEAD[cat], ctx).replace(/が$/, "")}で炎上した人の末路`
  }
}

async function askAI(ctx, file) {
  const sample = await window.claude?.use?.("sample")
  if (!sample) return null
  const lim = await sample.limits().catch(() => null)
  const canImg = file && lim?.images
  const prompt = `あなたは映画の宣伝用「炎上疑似体験SNS」の粗探しAIです。架空SNS「Y」に投稿された${canImg ? "写真と" : ""}ひとことを見て、細部を無理やり曲解した理不尽な批判で炎上シナリオを作ります。

投稿者プロフィール: 名前「${ctx.name}」 性別「${ctx.gender || "非公開"}」 年齢「${ctx.age || "非公開"}」 職業「${ctx.job || "非公開"}」
ひとこと: 「${ctx.text || "（本文なし）"}」
${canImg ? "写真に実際に写っている具体的な物・色・配置・背景を必ず拾って、こじつけてください。" : "写真はありません。本文の言葉尻を拾ってこじつけてください。"}

ルール:
- 理不尽さが笑えるトーン。脅迫、差別、性的な内容、実在の人物や企業名、住所などの個人情報は出さない
- コメントは日本のSNSらしい自然な口語で、1件40字以内
- あだ名は「孤独炒飯男」のような、写真の特徴と人物を組み合わせた4〜8字の造語。性別が男性なら末尾「男」、女性なら「女」、それ以外は「の人」

次の形のJSONだけを返してください:
{"nick":"あだ名","positive":["最初の好意的なコメント",4件],"replies":["粗探し・こじつけ・陰謀論・自称専門家などの批判",14件],"trends":["トレンドに並ぶ語句（#付きも可）",5件],"mom":["母からのLIMEメッセージ。回覧板や近所の噂など身内への影響",4件],"work":{"from":"職業に合った相手（上司・担任・取引先など、肩書きと名字）","lines":["その相手からの丁寧だが不穏なメッセージ",3件]},"friend":["友人からのメッセージ。最後はショート動画でまとめられていたという連絡",2件],"telop":["まとめ動画のテロップ",4行、各10字以内。2行目は「大炎上」などの短い語],"headline":"まとめ動画のタイトル"}`
  return sample.json(prompt, canImg ? { images: file } : {})
}

function merge(local, ai) {
  if (!ai || typeof ai !== "object") return local
  const arr = (v, n) => Array.isArray(v) ? v.filter(s => typeof s === "string" && s.trim()).map(s => s.trim().slice(0, 80)).slice(0, n) : []
  const str = (v, d) => typeof v === "string" && v.trim() ? v.trim().slice(0, 40) : d
  const out = { ...local }
  const pos = arr(ai.positive, 6), rep = arr(ai.replies, 18), tr = arr(ai.trends, 6), mom = arr(ai.mom, 5), fr = arr(ai.friend, 3), tel = arr(ai.telop, 4)
  if (pos.length) out.positive = pos
  if (rep.length >= 6) out.replies = [...rep, ...local.replies.slice(0, 4)]
  if (tr.length) out.trends = tr
  if (mom.length >= 2) out.mom = mom
  const wl = arr(ai.work?.lines, 4)
  if (wl.length) out.work = [{ from: str(ai.work.from, local.work[0].from), color: local.work[0].color, lines: wl }]
  if (fr.length) out.friend = { ...local.friend, lines: fr }
  if (tel.length === 4) out.telop = tel
  out.headline = str(ai.headline, local.headline)
  return out
}

function acts(c) {
  const box = el("div", "acts")
  for (const k of ["reply", "rt", "like", "view"]) {
    const s = el("span")
    s.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[k]}</svg>`
    s.append(fmt(c[k]))
    s.dataset.k = k
    box.append(s)
  }
  return box
}

function card({ name, uid, color, text, img, counts, cls, tag }) {
  const t = el("article", "tw " + (cls || ""))
  t.append(avatar(name, color))
  const head = el("div", "tw-head")
  head.append(el("b", "", name), el("span", "", "@" + uid), el("span", "", "・たった今"))
  t.append(head)
  const body = el("div", "tw-text")
  if (tag) body.append(el("span", "tag", tag))
  body.append(text)
  t.append(body)
  if (img) {
    const i = el("img", "tw-img")
    i.src = img
    i.alt = "投稿した写真"
    t.append(i)
  }
  t.append(acts(counts))
  return t
}

function setFlame(v) {
  run.flame = Math.min(100, v)
  $("fill").style.width = run.flame + "%"
  $("stage").textContent = STAGES.filter(s => run.flame >= s[0]).pop()[1]
  run.mainCard.classList.toggle("burn", run.flame > 30)
}

function bump(mult = 1) {
  const c = run.counts, f = run.flame
  c.reply = run.shown + Math.round(f ** 2.1 / 4)
  c.rt += Math.round(Math.random() * f * 12 * mult)
  c.like += Math.round((Math.random() * f * f * 2 + 3) * mult)
  c.view += Math.round(c.like * (2 + Math.random() * 5) + 30)
  run.mainCard.querySelectorAll(".acts span").forEach(s => s.lastChild.textContent = fmt(c[s.dataset.k]))
}

function reply(u, text, opt = {}) {
  const f = run.flame
  const counts = { reply: Math.random() * 2 * f | 0, rt: Math.random() * 4 * f | 0, like: Math.random() * 30 * f + 1 | 0, view: Math.random() * 700 * f + 20 | 0 }
  $("replies").prepend(card({ name: u[0], uid: u[1], color: u[2], text, counts, cls: opt.cls, tag: opt.tag }))
  run.shown++
  badge("home")
  if (opt.note !== false) notify(u[0], text, "y", "home")
}

function addTrend(word, label) {
  $("trendEmpty").hidden = true
  const ol = $("trends")
  const li = el("li")
  li.dataset.label = label
  li.append(el("small"), el("b", "", word), el("i", "", `${fmt(3000 + Math.random() * 60000)}件の投稿`))
  ol.prepend(li)
  ;[...ol.children].forEach((x, i) => x.firstChild.textContent = `${i + 1}位・${x.dataset.label}`)
  badge("trend")
}

function renderRooms() {
  const box = $("rooms")
  box.textContent = ""
  for (const r of [...rooms.values()].sort((a, b) => b.at - a.at)) {
    const b = el("button", "room")
    b.append(avatar(r.name, r.color), el("b", "", r.name), el("em", "", r.unread || ""), el("p", "", r.msgs.at(-1)?.text || ""))
    b.onclick = () => openTalk(r.id)
    box.append(b)
  }
}

function openTalk(id) {
  openRoom = id
  const r = rooms.get(id)
  r.unread = 0
  $("rooms").hidden = true
  $("talk").hidden = false
  $("back").hidden = false
  $("limeTitle").textContent = r.name
  const t = $("talk")
  t.textContent = ""
  r.msgs.forEach(m => t.append(bubble(r, m)))
  renderRooms()
}

function closeTalk() {
  openRoom = null
  $("rooms").hidden = false
  $("talk").hidden = true
  $("back").hidden = true
  $("limeTitle").textContent = "LIME"
  renderRooms()
}

function bubble(r, m) {
  const d = el("div", "msg")
  d.append(avatar(r.name, r.color), el("small", "", r.name + "・たった今"))
  if (m.link) {
    const a = el("a")
    a.append(el("b", "", m.text), el("span", "", "ショート動画・" + m.link))
    a.onclick = () => show("video")
    d.append(a)
  } else d.append(el("p", "", m.text))
  return d
}

function lime(id, name, color, text, link) {
  if (!rooms.has(id)) rooms.set(id, { id, name, color, msgs: [], unread: 0, at: 0 })
  const r = rooms.get(id)
  const m = { text, link }
  r.msgs.push(m)
  r.at = performance.now()
  if (openRoom === id && !$("s-lime").hidden) $("talk").append(bubble(r, m))
  else r.unread++
  renderRooms()
  badge("lime")
  notify(name, link ? "動画のリンクを送信しました" : text, "lime", "lime")
}

function buildReel(sc, ctx) {
  const box = $("reel")
  box.textContent = ""
  const r = el("div", "reel")
  const bg = el("div", "reel-bg")
  if (ctx.photo) bg.style.backgroundImage = `url("${ctx.photo}")`
  else { bg.classList.add("text"); bg.textContent = ctx.t }
  const tel = el("div", "telop")
  sc.telop.forEach((s, i) => {
    const sp = el("span", i === 1 ? "red" : "", s)
    sp.style.animationDelay = i * .3 + "s"
    tel.append(sp)
  })
  const sub = el("div", "sub")
  const prog = el("div", "prog")
  const foot = el("div", "reel-foot")
  foot.append(el("b", "", sc.headline), el("span", "", `#炎上 #${ctx.t} #${sc.nick}`))
  r.append(bg, tel, sub, foot, prog)
  box.append(r)
  return { sub, prog }
}

async function playReel(sc, ctx, alive) {
  const { sub, prog } = buildReel(sc, ctx)
  const lines = [`ある日、${ctx.name}さんが${ctx.photo ? "一枚の写真" : "ひとこと"}を投稿した`, "するとリプ欄の人たちが書き込んだ", ...sc.replies.slice(0, 4).map(s => `「${s}」`), `あだ名は「${sc.nick}」に決まった`, `${ctx.name}さんがしたのは、${ctx.t}の投稿だけである`]
  for (let i = 0; i < lines.length; i++) {
    if (!alive()) return
    sub.textContent = lines[i]
    prog.style.width = (i + 1) / lines.length * 100 + "%"
    await sleep(1900)
  }
}

function report(sc, ctx) {
  const c = run.counts
  const box = $("report")
  box.textContent = ""
  const nick = el("div", "nick", sc.nick)
  nick.prepend(el("small", "", "あなたについたあだ名"))
  const stats = el("div", "stats")
  ;[[c.reply, "リプライ"], [c.rt, "引用・リポスト"], [c.view, "表示回数"], [rooms.size, "LIMEで連絡してきた人"]].forEach(([v, k]) => {
    const d = el("div")
    d.append(el("b", "", fmt(v)), el("span", "", k))
    stats.append(d)
  })
  const btns = el("div", "btns")
  const again = el("button", "cta", "もう一度投稿")
  again.onclick = () => { reset(); show("post") }
  const prof = el("button", "ghost", "プロフィールを変える")
  prof.onclick = () => { reset(); show("prof") }
  btns.append(again, prof)
  box.append(el("h2", "", "炎上レポート"), nick, stats, el("p", "lesson", `あなたが投稿したのは${ctx.photo ? "写真1枚" : "ひとこと"}です。批判の理由は、リプ欄の人たちがあとから付けました。`), el("p", "fine", `トレンドに${$("trends").children.length}件入り、${[...rooms.values()].map(r => r.name).join("、")}からLIMEが届きました。`), btns)
}

function reset() {
  run = null
  rooms.clear()
  closeTalk()
  $("replies").textContent = ""
  $("mainPost").textContent = ""
  $("trends").textContent = ""
  $("trendEmpty").hidden = false
  $("reel").innerHTML = '<div class="empty">まだ動画はありません。</div>'
  $("banner").textContent = ""
  $("fill").style.width = "0"
  $("stage").textContent = "平和"
  $("tabs").hidden = true
  document.querySelectorAll(".tabs em").forEach(e => e.textContent = "")
}

function setStatus(text, mode) {
  $("statusText").textContent = text
  $("status").className = "status " + (mode || "")
}

async function start() {
  reset()
  const text = $("text").value.trim()
  const ctx = { ...profile, text, photo: photo?.url || null, pic: photo?.pic || null, ...topicOf(text) }
  ctx.trait = traitWord(ctx.pic)
  ctx.suffix = profile.gender === "男性" ? "男" : profile.gender === "女性" ? "女" : "の人"
  ctx.nick = pick(NICK_HEAD[ctx.cat]) + ctx.t.slice(0, 5) + ctx.suffix
  ctx.views = fmt(80000 + Math.random() * 3e6)
  const me = run = { flame: 0, shown: 0, counts: { reply: 0, rt: 0, like: 0, view: 12 } }
  const alive = () => run === me
  run.mainCard = card({ name: ctx.name, uid: ctx.uid, color: "#3d8bd4", text: text || " ", img: ctx.photo, counts: run.counts, cls: "main" })
  $("mainPost").append(run.mainCard)
  $("tabs").hidden = false
  show("home")
  const local = buildLocal(ctx)
  let aiState = "wait"
  setStatus("粗探しAIが写真を解析しています…")
  const aiP = askAI(ctx, photo?.file).then(r => {
    if (!r) throw 0
    aiState = "done"
    return r
  }).catch(() => { aiState = "off"; return null })

  let p = 0
  for (const s of local.positive.slice(0, 3)) {
    await sleep(1300); if (!alive()) return
    reply(pick(FANS), s, { cls: "good" }); setFlame(p += 2); bump(.3)
  }
  for (let i = 0; i < 40 && aiState === "wait"; i++) {
    await sleep(900); if (!alive()) return
    bump(.4)
    if (i % 4 === 3) notify(pick(FANS)[0], "あなたの投稿をいいねしました", "y", "home")
  }
  const ai = await Promise.race([aiP, new Promise(r => setTimeout(() => r(null), 300))])
  if (ai && typeof ai.nick === "string" && ai.nick.trim()) ctx.nick = ai.nick.trim().slice(0, 20)
  const sc = merge(ai ? buildLocal(ctx) : local, ai)
  setStatus(ai ? "粗探しAIが写真の解析を終えました" : aiState === "off" ? "簡易モードで炎上させています" : "解析が長引いたので簡易モードで続けます", ai ? "done" : "off")

  for (const s of sc.positive.slice(3, 5)) {
    await sleep(1100); if (!alive()) return
    reply(pick(FANS), s, { cls: "good" }); setFlame(p += 2); bump(.5)
  }
  const users = shuffle(USERS)
  const rs = sc.replies
  let ri = 0
  const next = () => users[ri % users.length]
  for (; ri < 5; ri++) {
    await sleep(1500); if (!alive()) return
    reply(next(), rs[ri]); setFlame(14 + ri * 4); bump()
  }
  await sleep(900); if (!alive()) return
  sc.trends.slice(0, 3).forEach((w, i) => addTrend(w, ["話題", "トレンド", "急上昇"][i]))
  notify("Y", "あなたに関する話題がトレンド入りしました", "y", "trend")
  show("trend")
  setFlame(38)
  await sleep(2600); if (!alive()) return
  show("home")
  reply(pick(MATOME), `【悲報】${ctx.age ? ctx.age + "歳" : ""}${ctx.job || ""}の${CAT_NAME[ctx.cat]}投稿、とんでもないことになる`, { cls: "quote", tag: "引用" })
  for (; ri < 11 && ri < rs.length; ri++) {
    await sleep(650); if (!alive()) return
    reply(next(), rs[ri]); setFlame(40 + (ri - 5) * 3); bump(1.5)
  }
  sc.trends.slice(3).forEach(w => addTrend(w, "急上昇"))
  await sleep(1200); if (!alive()) return

  show("lime")
  const w = sc.work
  const MOMC = "#b5577a"
  const steps = [
    ...sc.mom.slice(0, 2).map(t => ["mom", "母", MOMC, t]),
    ...w[0].lines.slice(0, 1).map(t => ["w0", w[0].from, w[0].color, t]),
    ...sc.mom.slice(2, 3).map(t => ["mom", "母", MOMC, t]),
    ...w[0].lines.slice(1).map(t => ["w0", w[0].from, w[0].color, t]),
    ...(w[1] ? w[1].lines.map(t => ["w1", w[1].from, w[1].color, t]) : []),
    ...sc.mom.slice(3).map(t => ["mom", "母", MOMC, t])
  ]
  let prev = null
  for (const [i, [id, name, color, t]] of steps.entries()) {
    await sleep(1500); if (!alive()) return
    lime(id, name, color, t)
    if (id !== prev) openTalk(id)
    prev = id
    setFlame(62 + i * 2); bump(2)
    if (ri < rs.length && i % 2) reply(next(), rs[ri++], { note: false })
  }
  const fr = sc.friend
  for (const [i, t] of fr.lines.entries()) {
    await sleep(1600); if (!alive()) return
    const last = i === fr.lines.length - 1
    lime("friend", fr.from, fr.color, t, last ? `${ctx.views}回再生` : null)
    if (i === 0) openTalk("friend")
    setFlame(86 + i * 3); bump(3)
  }
  await sleep(2200); if (!alive()) return
  show("video")
  setFlame(96)
  await playReel(sc, ctx, alive)
  if (!alive()) return
  setFlame(100); bump(4)
  report(sc, ctx)
  show("end")
}

$("join").onclick = () => show("prof")

JOBS.forEach(j => {
  const b = el("button", "", j)
  b.type = "button"
  b.onclick = () => { $("job").value = j }
  $("jobChips").append(b)
})

$("profForm").addEventListener("submit", e => {
  e.preventDefault()
  const name = $("name").value.trim()
  if (!name) return
  profile = {
    name,
    uid: $("uid").value.trim().replace(/\W/g, "") || "user" + (Math.random() * 9000 + 1000 | 0),
    gender: $("gender").value,
    age: Math.min(120, parseInt($("age").value) || 0) || "",
    job: $("job").value.trim()
  }
  show("post")
})

function setPhoto(f) {
  if (!f || !f.type.startsWith("image/")) return
  const r = new FileReader()
  r.onload = async () => {
    photo = { file: f, url: r.result, pic: await analyze(r.result) }
    const box = $("drop")
    box.querySelector("img")?.remove()
    const img = el("img")
    img.src = r.result
    img.alt = "選んだ写真"
    box.prepend(img)
    $("dropText").hidden = true
    updSend()
  }
  r.readAsDataURL(f)
}

$("file").addEventListener("change", e => setPhoto(e.target.files[0]))
const drop = $("drop")
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over") })
drop.addEventListener("dragleave", () => drop.classList.remove("over"))
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); setPhoto(e.dataTransfer.files[0]) })

function updSend() {
  const n = $("text").value.length
  $("count").textContent = `${n} / 140`
  $("send").disabled = !n && !photo
}
$("text").addEventListener("input", updSend)

$("postForm").addEventListener("submit", e => {
  e.preventDefault()
  if (!$("send").disabled) start()
})

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => show(b.dataset.tab))
$("back").onclick = closeTalk
$("fast").onclick = e => {
  speed = speed === 1 ? 3 : 1
  e.currentTarget.setAttribute("aria-pressed", speed > 1)
}
$("sound").onclick = e => {
  muted = !muted
  e.currentTarget.setAttribute("aria-pressed", !muted)
}

Promise.resolve(window.claude?.use?.("sample")).then(s => {
  if (!s) $("aiNote").textContent = "粗探し係が、写真の明るさや色、文面、プロフィールから粗を探します。"
})
